# Time alignment and target definitions (Stage 4, tasks 3 and 5).
#
# Overpass times over South India, checked 2026-11-03 on Earth Engine images with data at
# Kochi and Hyderabad (2023-01-05..11): TROPOMI orbit segments 12:09-14:11 IST; MAIAC Aqua
# granules 13:15-15:00 IST, Terra 10:15-11:15 IST. The window below covers TROPOMI and Aqua.
timezone: Asia/Kolkata
overpass_window:
  start_hour: 12            # IST, hours whose START is in [start_hour, end_hour)
  end_hour: 15
  min_valid_hours: 2        # of 3 (D034)
daily:
  min_valid_hours: 18       # D012
lags_days: [1, 2, 3]
lag_variables: [pm25_daily, t2m_c, rh, wind_speed, precip_mm, blh]
