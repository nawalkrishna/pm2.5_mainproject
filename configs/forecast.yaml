# Stage 6: hourly PM2.5 forecasting at existing stations (D045-D051, docs/stage6_forecasting.md).

seed: 42
version: 1
horizons: [1, 3, 6, 12, 24, 48, 72]   # reported (D045); the neural networks predict 1-72
max_horizon: 72

splits:                       # D047: issue-hour years; the last purge_hours of train / val are dropped
  train_years: [2021, 2022, 2023]
  val_years: [2024]
  test_years: [2025]
  purge_hours: 72

timing:                       # D046
  instant_lag: 0              # ERA5 instantaneous fields: hours <= H
  average_lag: 1              # precipitation, MERRA-2: hours <= H - 1
  satellite_from_hour: 15     # day d's satellite value usable from issue hour H >= 15 IST, else day d - 1

satellite_geometry: b10       # D035
satellite_columns: [no2_trop, co, so2, hcho, uvai, cloud_frac, no2_cloud, aod_clear]
satellite_counts: [no2_trop_n, aod_clear_n]
tier_a_requires: aod_clear    # D049: Tier A where the satellite day has MAIAC AOD

meteorology: [t2m_c, rh, u10, v10, wind_speed, blh, precip_mm]
instant_met: [t2m_c, rh, u10, v10, wind_speed, blh]
average_met: [precip_mm]
aerosol: [merra2_pm25, merra2_aod]
static: [elevation_m, dist_to_coast_km, lc_tree, lc_crop, lc_built, lc_water, lc_grass_shrub, population_b5]

tabular:                      # issue-time features for linear / Random Forest (src/forecast/features.py)
  pm_lags: [0, 1, 2, 3, 6, 12, 23, 24, 48]   # PM2.5 at H - k
  pm_windows: [6, 24, 72]                    # mean and valid count over the last k hours
  met_windows: [24]                          # mean (sum for precipitation) over the last k hours
  rf_train_fraction: 0.333                   # random share of training rows (cost, D048)
  random_forest: {n_estimators: 200, min_samples_leaf: 5, max_features: 0.5, max_samples: 0.5}

nets:                         # D048, D051
  seeds: [42, 1, 2]
  input_hours: 72
  hidden: 64
  layers: 1
  head_hidden: 128
  dropout: 0.1
  batch_size: 16              # issue hours per batch (each = all stations)
  max_epochs: 60
  epoch_fraction: 0.333       # random share of training issue hours per epoch (cost)
  patience: 8
  learning_rate: 0.001
  pm_ffill_hours: 24
  graph_km: 200               # stations within 200 km linked (Qi et al. 2019)
  train_issue_stride: 1       # every issue hour
  weight_decay: 0.0
  tuning:                     # src/forecast/tune_nets.py: LSTM, setting a, Tier B, scored on the validation year only
    base: {}
    lr_3e-4: {learning_rate: 0.0003}
    regularised: {weight_decay: 0.0001, dropout: 0.2}
    hidden_128: {hidden: 128}
    input_24h: {input_hours: 24}

bootstrap:                    # D050
  n: 1000
  seed: 42

cloud_bins: [0.0, 0.2, 0.5, 0.8, 1.0001]       # as D041
